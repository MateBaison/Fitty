name: Renew Apple sign-in secret

# Apple's client secret expires after six months. This builds a fresh one every
# month and stores it in Supabase, so sign in with Apple never stops working.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @fitty/web...
      - name: Build the secret and update Supabase
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: pebgpdnaihnfjtbrjbto
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/apple-key.p8"
          umask 077
          printf '%s\n' "$APPLE_PRIVATE_KEY" > "$key"
          secret="$(pnpm --filter @fitty/web exec tsx scripts/apple-client-secret.ts \
            --team "$APPLE_TEAM_ID" --key-id "$APPLE_KEY_ID" \
            --services-id "$APPLE_SERVICES_ID" --key-file "$key")"
          rm -f "$key"
          echo "::add-mask::$secret"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"external_apple_secret\":\"$secret\"}")"
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
